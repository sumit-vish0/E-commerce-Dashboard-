{% extends 'inventory/base.html' %}
{% block content %}
<h3>{% if product %}Edit Product Details{% else %}Add New Product{% endif %}</h3>
<div class="card-box mt-4"><form method="POST">{% csrf_token %}
<div class="row">
<div class="col-md-6 mb-3"><label>Product Name *</label><input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" required></div>
<div class="col-md-6 mb-3"><label>Category *</label><input type="text" name="category" class="form-control" value="{{ product.category|default:'' }}" required></div>
<div class="col-md-6 mb-3"><label>Price (₹) *</label><input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ product.price|default:'' }}" required></div>
<div class="col-md-6 mb-3"><label>Quantity *</label><input type="number" min="0" name="quantity" class="form-control" value="{{ product.quantity|default:'' }}" required></div>
<div class="col-md-12 mb-3"><label>Supplier Name *</label><input type="text" name="supplier" class="form-control" value="{{ product.supplier|default:'' }}" required></div>
<div class="col-md-12 mt-3"><button type="submit" class="btn btn-primary">{% if product %}Update Product{% else %}Save Product{% endif %}</button>
<a href="{% url 'inventory:products' %}" class="btn btn-secondary ms-2">Cancel</a></div>
</div></form></div>
{% endblock %}
