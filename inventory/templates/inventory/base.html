{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>{% block title %}E-Com Dashboard{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'inventory/style.css' %}">
</head>
<body>
<div class="wrapper">
<div class="sidebar">
<div class="logo-box">
<div class="logo-circle">EC</div>
<div><h6>E-Com Dashboard</h6><small>Inventory Manager</small></div>
</div>
<ul>
<li><a href="{% url 'inventory:dashboard' %}">Dashboard</a></li>
<li><a href="{% url 'inventory:products' %}">Products</a></li>
<li><a href="{% url 'inventory:add_product' %}">+ Add Product</a></li>
<li><a href="{% url 'inventory:revenue' %}">Revenue</a></li>
</ul>
<div class="admin">👤 admin</div>
</div>
<div class="content">
{% if messages %}
{% for message in messages %}
<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}
{% block content %}{% endblock %}
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
